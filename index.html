<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14264a">
<title>LoanShield AI</title>

<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#657187;--primary:#245eea;--border:#e1e7f0}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
body.dark{--bg:#101827;--card:#1b2638;--text:#f2f5fb;--muted:#b3bfd1;--primary:#78a0ff;--border:#344155}
header{background:#14264a;color:white;padding:20px 16px}
.top{max-width:850px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-size:22px;font-weight:800}.brand span{color:#75a2ff}
.controls{display:flex;gap:7px;align-items:center}
button,select,input,textarea{font:inherit;border-radius:10px}
button{border:0;padding:12px;cursor:pointer;font-weight:700}
.langSelect,.theme{background:#263c63;color:white;border:0}
.langSelect{width:auto;max-width:145px;padding:12px 7px;font-weight:700}
.theme{min-width:52px;font-size:21px}
main{max-width:850px;padding:20px 14px 45px;margin:auto}
.hero{background:linear-gradient(135deg,#1b4fc4,#673bd2);color:white;border-radius:28px;padding:28px 22px;margin-bottom:18px}
.hero h1{font-size:27px;margin:0 0 12px;line-height:1.25}
.hero p{font-size:18px;line-height:1.55;margin:0}
.card{background:var(--card);border:1px solid var(--border);border-radius:28px;padding:22px;margin:18px 0}
h2{font-size:22px;margin:0 0 20px}
label{display:block;font-weight:700;margin:18px 0 8px}
input,textarea,.field{width:100%;padding:15px;background:var(--bg);color:var(--text);border:1px solid var(--border);font-size:16px}
textarea{min-height:115px;resize:vertical}
.primary{width:100%;margin-top:18px;background:var(--primary);color:white;padding:15px}
.secondary{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.note,.muted{color:var(--muted);font-size:13px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.tile h3{margin-top:0}.tile p{color:var(--muted);line-height:1.5}
#result{display:none}
.score{font-size:38px;font-weight:800;color:var(--primary);margin:12px 0}
ul{padding-inline-start:22px;line-height:1.8}
footer{text-align:center;color:var(--muted);font-size:13px;padding:15px 20px 30px}
html[dir=rtl] body{text-align:right}
@media(max-width:520px){.grid{grid-template-columns:1fr}.brand{font-size:19px}.hero h1{font-size:25px}.card{padding:18px}.langSelect{max-width:125px}}
</style>
</head>

<body>
<header>
 <div class="top">
  <div class="brand">🛡️ LoanShield <span>AI</span></div>
  <div class="controls">
   <select class="langSelect" id="languageSelect" aria-label="Language">
    <option value="en">English</option>
    <option value="hi">हिन्दी</option>
    <option value="ur">اردو</option>
    <option value="pa">ਪੰਜਾਬੀ</option>
    <option value="ml">മലയാളം</option>
    <option value="kn">ಕನ್ನಡ</option>
    <option value="gu">ગુજરાતી</option>
    <option value="bn">বাংলা</option>
    <option value="ta">தமிழ்</option>
    <option value="te">తెలుగు</option>
    <option value="mr">मराठी</option>
   </select>
   <button class="theme" id="themeBtn" aria-label="Toggle dark mode">🌙</button>
  </div>
 </div>
</header>

<main>
 <section class="hero">
  <h1 id="heroTitle"></h1>
  <p id="heroText"></p>
 </section>

 <section class="card">
  <h2 id="reviewTitle"></h2>

  <label id="companyLabel" for="company"></label>
  <input id="company" autocomplete="off">

  <label id="offerLabel" for="offer"></label>
  <textarea id="offer"></textarea>

  <label id="feeLabel" for="fees"></label>
  <select id="fees" class="field">
   <option value="unknown" data-t="feeUnknown"></option>
   <option value="yes" data-t="feeYes"></option>
   <option value="no" data-t="feeNo"></option>
  </select>

  <label id="regLabel" for="lender"></label>
  <select id="lender" class="field">
   <option value="unknown" data-t="lenderUnknown"></option>
   <option value="verified" data-t="lenderVerified"></option>
   <option value="unverified" data-t="lenderUnverified"></option>
  </select>

  <label id="advanceLabel" for="advance"></label>
  <select id="advance" class="field">
   <option value="no" data-t="no"></option>
   <option value="yes" data-t="yes"></option>
   <option value="unknown" data-t="feeUnknown"></option>
  </select>

  <button class="primary" id="reviewBtn"></button>
  <p class="note" id="privacyNote"></p>
 </section>

 <section class="card" id="result" aria-live="polite">
  <h2 id="resultTitle"></h2>
  <div class="score" id="score"></div>
  <p id="scoreLabel"></p>
  <h3 id="redTitle"></h3>
  <ul id="redList"></ul>
  <h3 id="greenTitle"></h3>
  <ul id="greenList"></ul>
  <button class="secondary" id="shareBtn"></button>
 </section>

 <section class="grid">
  <div class="tile"><h3 id="redCardTitle"></h3><p id="redCardText"></p></div>
  <div class="tile"><h3 id="greenCardTitle"></h3><p id="greenCardText"></p></div>
 </section>

 <section class="card">
  <h2 id="stepsTitle"></h2>
  <ul id="stepsList"></ul>
 </section>
</main>

<footer id="footerText"></footer>

function tr(key){
 const i=keys.indexOf(key);
 const a=translations[currentLang]||en;
 if(i<0)return key;
 if(key==="steps")return (a[29]||en[29]).split("|");
 if(i>=31)return ((a[31]||en[31]).split("|")[i-31]||"");
 return a[i]||en[i];
}

let currentLang="en",lastReport=null;

function setLanguage(lang){
 currentLang=translations[lang]?lang:"en";
 try{localStorage.setItem(LANG_KEY,currentLang)}catch(e){}
 document.documentElement.lang=currentLang;
 document.documentElement.dir=currentLang==="ur"?"rtl":"ltr";
 $("languageSelect").value=currentLang;

 const ids=keys.slice(0,31).filter(k=>k!=="steps");
 ids.forEach(k=>{if($(k))$(k).textContent=tr(k)});

 $("company").placeholder=tr("companyPlaceholder");
 $("offer").placeholder=tr("offerPlaceholder");

 document.querySelectorAll("[data-t]").forEach(o=>o.textContent=tr(o.dataset.t));
 $("stepsList").innerHTML=tr("steps").map(s=>"<li>"+escapeHTML(s)+"</li>").join("");

 if(lastReport)renderReport();
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function toggleTheme(){
 document.body.classList.toggle("dark");
 const dark=document.body.classList.contains("dark");
 $("themeBtn").textContent=dark?"☀️":"🌙";
 try{localStorage.setItem(THEME_KEY,dark?"dark":"light")}catch(e){}
}

function reviewOffer(){
 const company=$("company").value.trim();
 const offer=$("offer").value.trim();
 const fees=$("fees").value;
 const lender=$("lender").value;
 const advance=$("advance").value;

 let risk=0,red=[],green=[];

 if(lender==="unverified"){risk+=35;red.push(tr("lenderBad"))}
 else if(lender==="unknown"){risk+=15;red.push(tr("lenderCheck"))}
 else green.push(tr("lenderGood"));

 if(fees==="no"){risk+=25;red.push(tr("feesBad"))}
 else if(fees==="unknown"){risk+=10;red.push(tr("feesCheck"))}
 else green.push(tr("feesGood"));

 if(advance==="yes"){risk+=35;red.push(tr("advanceBad"))}
 else if(advance==="unknown"){risk+=10;red.push(tr("advanceCheck"))}
 else green.push(tr("advanceGood"));

 if(/otp|pin|password|urgent|guaranteed|processing fee|pay first|advance fee|unlock loan|send money/i.test(offer)){
  risk+=20;red.push(tr("suspicious"));
 }

 if(!company&&!offer)red.push(tr("enterDetails"));

 const score=100-Math.min(100,risk);
 $("result").style.display="block";
 $("score").textContent=score+"/100";
 $("scoreLabel").textContent=tr("scoreLabel");
 $("redList").innerHTML=(red.length?red:[tr("noRisks")]).map(s=>"<li>"+escapeHTML(s)+"</li>").join("");
 $("greenList").innerHTML=(green.length?green:[tr("verifyTerms")]).map(s=>"<li>"+escapeHTML(s)+"</li>").join("");

 lastReport={company,score,red};
 renderReport();
 $("result").scrollIntoView({behavior:"smooth",block:"start"});
}

function renderReport(){
 if(!lastReport)return;
 $("scoreLabel").textContent=tr("scoreLabel");
 let report=[tr("reportTitle")];
 if(lastReport.company)report.push(tr("lenderPrefix")+lastReport.company);
 report.push(tr("scorePrefix")+lastReport.score+"/100");
 report.push(...lastReport.red);
 report.push(tr("noGuarantee"));
 lastReport.text=report.join("\n");
}

function shareReport(){
 const msg=lastReport?lastReport.text:tr("report");
 const url="https://wa.me/?text="+encodeURIComponent(msg);
 if(window.LoanShieldApp&&typeof window.LoanShieldApp.shareOnWhatsApp==="function"){
  window.LoanShieldApp.shareOnWhatsApp(msg);
 }else{
  window.open(url,"_blank");
 }
}

$("languageSelect").addEventListener("change",e=>setLanguage(e.target.value));
$("themeBtn").addEventListener("click",toggleTheme);
$("reviewBtn").addEventListener("click",reviewOffer);
$("shareBtn").addEventListener("click",shareReport);

try{
 if(localStorage.getItem(THEME_KEY)==="dark"){
  document.body.classList.add("dark");
  $("themeBtn").textContent="☀️";
 }
 const saved=localStorage.getItem(LANG_KEY);
 if(saved&&translations[saved])currentLang=saved;
}catch(e){}

setLanguage(currentLang);
</script>
