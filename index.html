
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoanShield AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: #f3f6fb;
      color: #172033;
    }
    main {
      background: white;
      padding: 24px;
      border-radius: 16px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      font-size: 16px;
    }
    button {
      background: #174ea6;
      color: white;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>LoanShield AI</h1>
    <p>Check your loan offer for basic warning signs.</p>
    <label for="rate">Annual interest rate (%)</label>
    <input id="rate" type="number" min="0" max="200" step="0.1"
           placeholder="Enter interest rate">
    <button onclick="checkLoan()">Check Loan</button>
    <p id="result" aria-live="polite"></p>
    <p><small>This is a basic educational check, not financial advice.</small></p>
  </main>
  <script>
    function checkLoan() {
      const rate = Number(document.getElementById('rate').value);
      const result = document.getElementById('result');
      if (document.getElementById('rate').value.trim() === '' ||
          !Number.isFinite(rate) || rate < 0 || rate > 200) {
        result.textContent = 'Enter a valid interest rate between 0 and 200%.';
      } else if (rate > 36) {
        result.textContent = 'Warning: this is a very high interest rate. Check all terms and fees carefully.';
      } else if (rate > 18) {
        result.textContent = 'Caution: compare other offers and check the total repayment and fees.';
      } else {
        result.textContent = 'Check the lender, fees, repayment schedule and loan agreement before accepting.';
      }
    }
  </script>
</body>
</html>
